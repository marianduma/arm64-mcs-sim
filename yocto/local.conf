# Configuration file for Yocto build system.
# Copied over the default configuration file from the Yocto project and modified for the specific build environment.

MACHINE = "qemuarm64"
INHERIT += "rm_work"
DISTRO = "mcs-linux"

BB_NUMBER_THREADS = "${@oe.utils.cpu_count()}"
PARALLEL_MAKE = "-j ${@oe.utils.cpu_count()}"