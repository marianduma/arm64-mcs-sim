# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mcs"
BBFILE_PATTERN_meta-mcs = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mcs = "6"

LAYERDEPENDS_meta-mcs = "core"
LAYERSERIES_COMPAT_meta-mcs = "wrynose"
